services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: viva
      POSTGRES_PASSWORD: viva
      POSTGRES_DB: viva
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viva"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
